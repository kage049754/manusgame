name: Godot Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Check project opens in headless editor
        run: godot --headless --editor --path . --quit
      - name: Smoke-test main scene
        run: timeout 20s godot --headless --path . --quit-after 3
